dag_type: plain_text
description: A simple workflow to test the system
name: test_workflow
nodes:
  initialize_test:
    agent: false
    description: Initialize the test environment
    name: initialize_test
    nodes_depended_on: []
    nodes_dependent_on:
    - run_test
    prompt: Prepare the test environment for execution.
  run_test:
    agent: false
    description: Execute the test
    name: run_test
    nodes_depended_on:
    - initialize_test
    nodes_dependent_on:
    - validate_test_results
    prompt: Run the test using the prepared environment.
  validate_test_results:
    agent: false
    description: Validate the results of the test
    name: validate_test_results
    nodes_depended_on:
    - run_test
    nodes_dependent_on: []
    prompt: Check the test results for correctness and completeness.
